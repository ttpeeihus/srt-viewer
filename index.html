<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SRT Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;

<body>

  <div class="container">

    <h1>SRT Viewer</h1>
    <div class="description">
      Upload file <code>.srt</code> để xem nội dung subtitle.
    </div>

    <label class="upload-box" id="uploadBox">
      <input type="file" id="fileInput" accept=".srt,text/plain">

      <div class="upload-title">
        📄 Chọn file SRT
      </div>

      <div class="upload-hint">
        Click để chọn file hoặc kéo thả file vào đây
      </div>
    </label>

    <div class="error" id="error"></div>

    <div class="file-info" id="fileInfo"></div>

    <div class="toolbar" id="toolbar">
      <input
        type="text"
        id="searchInput"
        class="search"
        placeholder="Tìm kiếm nội dung subtitle..."
      >

      <div class="count" id="count"></div>
    </div>

    <div class="subtitle-list" id="subtitleList"></div>

    <div class="empty" id="empty">
      Không tìm thấy subtitle phù hợp.
    </div>

  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const uploadBox = document.getElementById("uploadBox");
    const fileInfo = document.getElementById("fileInfo");
    const toolbar = document.getElementById("toolbar");
    const searchInput = document.getElementById("searchInput");
    const subtitleList = document.getElementById("subtitleList");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const error = document.getElementById("error");

    let subtitles = [];

    fileInput.addEventListener("change", (event) => {
      const file = event.target.files[0];

      if (file) {
        loadSRT(file);
      }
    });

    uploadBox.addEventListener("dragover", (event) => {
      event.preventDefault();
      uploadBox.classList.add("dragover");
    });

    uploadBox.addEventListener("dragleave", () => {
      uploadBox.classList.remove("dragover");
    });

    uploadBox.addEventListener("drop", (event) => {
      event.preventDefault();

      uploadBox.classList.remove("dragover");

      const file = event.dataTransfer.files[0];

      if (file) {
        loadSRT(file);
      }
    });

    searchInput.addEventListener("input", () => {
      renderSubtitles(searchInput.value);
    });

    async function loadSRT(file) {
      hideError();

      if (!file.name.toLowerCase().endsWith(".srt")) {
        showError("Vui lòng chọn file .srt");
        return;
      }

      try {
        const buffer = await file.arrayBuffer();

        // UTF-8
        let text = new TextDecoder("utf-8").decode(buffer);

        // Remove UTF-8 BOM
        text = text.replace(/^\uFEFF/, "");

        subtitles = parseSRT(text);

        if (!subtitles.length) {
          showError("Không tìm thấy subtitle hợp lệ trong file.");
          return;
        }

        fileInfo.style.display = "block";
        fileInfo.innerHTML = `
          <strong>${escapeHTML(file.name)}</strong>
          <br>
          <small>
            ${(file.size / 1024).toFixed(1)} KB
            · ${subtitles.length} subtitle
          </small>
        `;

        toolbar.style.display = "flex";

        searchInput.value = "";

        renderSubtitles();

      } catch (err) {
        console.error(err);
        showError("Không thể đọc file SRT.");
      }
    }

    function parseSRT(content) {
      // Normalize line endings
      content = content
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n");

      // Split subtitle blocks
      const blocks = content
        .split(/\n\s*\n/)
        .map(block => block.trim())
        .filter(Boolean);

      const result = [];

      for (const block of blocks) {
        const lines = block.split("\n");

        if (lines.length < 3) {
          continue;
        }

        let index = lines[0].trim();
        let timeLineIndex = 1;

        // Handle SRT without numeric index
        if (!/^\d+$/.test(index)) {
          index = result.length + 1;
          timeLineIndex = 0;
        }

        const timeLine = lines[timeLineIndex];

        if (!timeLine || !timeLine.includes("-->")) {
          continue;
        }

        const [start, end] = timeLine
          .split("-->")
          .map(s => s.trim());

        const text = lines
          .slice(timeLineIndex + 1)
          .join("\n")
          .trim();

        if (!text) {
          continue;
        }

        result.push({
          index,
          start,
          end,
          text
        });
      }

      return result;
    }

    function renderSubtitles(keyword = "") {
      const query = keyword.trim().toLowerCase();

      const filtered = subtitles.filter(subtitle => {
        if (!query) {
          return true;
        }

        return subtitle.text.toLowerCase().includes(query);
      });

      subtitleList.innerHTML = "";

      count.textContent =
        `${filtered.length} / ${subtitles.length} subtitle`;

      if (!filtered.length) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      const fragment = document.createDocumentFragment();

      for (const subtitle of filtered) {
        const item = document.createElement("div");

        item.className = "subtitle";

        item.innerHTML = `
          <div class="subtitle-header">
            <span class="index">
              #${escapeHTML(String(subtitle.index))}
            </span>

            <span class="time">
              ${escapeHTML(subtitle.start)}
              →
              ${escapeHTML(subtitle.end)}
            </span>
          </div>

          <div class="text">
            ${escapeHTML(subtitle.text)}
          </div>
        `;

        fragment.appendChild(item);
      }

      subtitleList.appendChild(fragment);
    }

    function escapeHTML(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showError(message) {
      error.textContent = message;
      error.style.display = "block";
    }

    function hideError() {
      error.style.display = "none";
    }
  </script>

</body>
</html>
